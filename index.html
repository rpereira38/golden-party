<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golden Party — Matilde &amp; Rúben</title>
<style>
:root{--gold:#b18a3b;--gold-d:#8a6a28;--bg:#fffdf8;--ink:#2b2b2b;--mut:#7a7466;--line:#eadfc6;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{text-align:center;padding:36px 16px 12px}
h1{margin:0;font-weight:400;font-size:clamp(28px,7vw,44px);color:var(--gold);letter-spacing:.04em}
h1 span{display:block;font-size:.45em;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-top:6px}
main{max-width:1100px;margin:0 auto;padding:0 16px 80px}
.banner{margin:16px auto;max-width:560px;text-align:center;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--mut);font-family:system-ui,sans-serif;font-size:14px}
.card{max-width:460px;margin:20px auto;padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center;font-family:system-ui,sans-serif}
.card h2{font-family:Georgia,serif;font-weight:400;color:var(--gold);margin:0 0 10px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:8px 0}
button,.btn{background:var(--gold);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:15px;cursor:pointer;font-family:system-ui,sans-serif}
button:hover{background:var(--gold-d)}button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin:20px 0;font-family:system-ui,sans-serif;font-size:14px;color:var(--mut)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.grid{column-gap:14px;columns:2}
@media(min-width:700px){.grid{columns:3}}@media(min-width:1000px){.grid{columns:4}}
.ph{break-inside:avoid;margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.ph img{display:block;width:100%;height:auto;background:#f4ecd8}
.ph .meta{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-family:system-ui,sans-serif;font-size:13px}
.ph .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
.like{background:none;color:var(--gold);padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.like.on{background:var(--gold);color:#fff}.like:hover{background:var(--line)}.like.on:hover{background:var(--gold-d)}
.rank{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--gold-d);border-radius:999px;padding:2px 9px;font:600 12px system-ui}
.winner{max-width:520px;margin:24px auto;padding:22px;text-align:center;border:2px solid var(--gold);border-radius:22px;background:linear-gradient(180deg,#fff8e4,#fff);animation:glow 2.4s ease-in-out infinite alternate}
.winner img{width:100%;border-radius:14px;margin:12px 0}
@keyframes glow{from{box-shadow:0 0 0 rgba(177,138,59,0)}to{box-shadow:0 0 34px rgba(177,138,59,.45)}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.msg{min-height:20px;font:14px system-ui;margin-top:10px}.err{color:#b3261e}.okm{color:#2e7d32}
progress{width:100%;margin-top:10px;accent-color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><h1>Golden Party<span>Matilde &amp; Rúben</span></h1><button id="shareBtn" class="ghost" style="margin-top:14px">Partilhar</button></header>
<main>
  <div id="banner" class="banner" hidden></div>
  <section id="winnerBox" hidden></section>

  <section id="reg" class="card" hidden>
    <h2>Bem-vindo(a)</h2>
    <p>Diz-nos o teu nome para participares na competição fotográfica.</p>
    <input id="nameIn" type="text" maxlength="40" placeholder="O teu nome" autocomplete="name">
    <button id="regBtn">Entrar</button>
    <div id="regMsg" class="msg" role="status"></div>
  </section>

  <section id="up" class="card" hidden>
    <h2>A tua fotografia</h2>
    <p id="upHint">JPEG, PNG ou WebP, até 15 MB. Podes substituí-la enquanto a competição estiver aberta.</p>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <button id="pickBtn">Escolher fotografia</button>
    <progress id="prog" max="100" value="0" hidden></progress>
    <div id="upMsg" class="msg" role="status"></div>
  </section>

  <div class="bar" id="bar" hidden>
    <span id="counts"></span>
    <label>Ordenar: <select id="sort"><option value="pop">Popularidade</option><option value="new">Mais recentes</option><option value="rand">Aleatória</option></select></label>
  </div>
  <div id="grid" class="grid"></div>
  <p id="empty" class="banner" hidden>Ainda não há fotografias.</p>
</main>

<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbyWyFt0lmQB4aKQJqViAWXpM7WRw3p15jlwVEz1BwWMAc_h1htBLmSXYykEsLc7bc8QGw/exec';
const $ = (id) => document.getElementById(id);
const OK_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
const MAX = 15 * 1024 * 1024, DIM = 2000, QUALITY = 0.82;
let me = null, G = null, S = null, liked = new Set(), shuffle = null, busy = false;

try { me = JSON.parse(localStorage.getItem('gp_me') || 'null'); } catch (e) {}

async function api(action, body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json();
  if (!j.success) throw new Error(j.error ? j.error.message : 'Erro desconhecido.');
  return j.data;
}
async function get(action) {
  const r = await fetch(API_URL + '?action=' + action);
  const j = await r.json();
  if (!j.success) throw new Error(j.error.message);
  return j.data;
}
const imgUrl = (id, w) => 'https://lh3.googleusercontent.com/d/' + id + '=w' + w;
const msg = (el, t, cls) => { el.textContent = t; el.className = 'msg ' + (cls || ''); };

async function refresh() {
  try {
    [S, G] = await Promise.all([get('state'), get('gallery')]);
    if (me && !liked.size) { try { liked = new Set((await api('myLikes', { token: me.token })).photoIds); } catch (e) {} }
  } catch (e) { showBanner('Não foi possível carregar os dados. ' + e.message); return; }
  render();
}

function showBanner(t) { $('banner').textContent = t; $('banner').hidden = !t; }

function render() {
  const st = G.state;
  const fmt = (iso) => new Date(iso).toLocaleString('pt-PT', { dateStyle: 'long', timeStyle: 'short' });
  showBanner({
    not_configured: 'A competição será anunciada em breve.',
    upcoming: 'A competição começa a ' + (S.start ? fmt(S.start) : '') + '.',
    open: 'Competição aberta' + (S.end ? ' até ' + fmt(S.end) : '') + '. Participa e vota!',
    ended: 'A competição terminou. Obrigado a todos!'
  }[st]);

  $('reg').hidden = !!me || st === 'ended';
  $('up').hidden = !me || st !== 'open';
  $('bar').hidden = false;
  $('counts').textContent = G.participants + ' participantes · ' + G.photoCount + ' fotografias';
  $('empty').hidden = G.photoCount > 0;
  renderWinner();
  renderGrid();
}

function renderWinner() {
  const box = $('winnerBox'); box.replaceChildren();
  if (!G.winner) { box.hidden = true; return; }
  box.hidden = false;
  const w = document.createElement('div'); w.className = 'winner';
  const h = document.createElement('h2'); h.textContent = '🏆 Fotografia vencedora'; h.style.cssText = 'font-weight:400;color:var(--gold);margin:0';
  const im = document.createElement('img'); im.src = imgUrl(G.winner.fileId, 1000); im.alt = 'Fotografia vencedora';
  const p = document.createElement('div'); p.textContent = G.winner.participantName + ' · ' + G.winner.likeCount + ' gostos';
  w.append(h, im, p); box.append(w);
}

function renderGrid() {
  const mode = $('sort').value;
  let list = G.photos.slice();
  if (mode === 'new') list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  else if (mode === 'rand') {
    if (!shuffle) shuffle = Object.fromEntries(list.map((p) => [p.id, Math.random()]));
    list.sort((a, b) => (shuffle[a.id] ?? 1) - (shuffle[b.id] ?? 1));
  }
  const grid = $('grid'); grid.replaceChildren();
  list.forEach((p) => {
    const f = document.createElement('figure'); f.className = 'ph';
    const im = document.createElement('img'); im.loading = 'lazy'; im.decoding = 'async';
    im.src = imgUrl(p.fileId, 600); im.alt = 'Fotografia de ' + p.participantName;
    const r = document.createElement('span'); r.className = 'rank'; r.textContent = '#' + p.rank;
    const m = document.createElement('div'); m.className = 'meta';
    const who = document.createElement('span'); who.className = 'who'; who.textContent = p.participantName;
    m.append(who);
    const own = me && me.participantId === p.participantId;
    if (me && G.state !== 'ended') { const fl = document.createElement('button'); fl.className = 'like'; fl.textContent = '⚑'; fl.title = 'Pedir remoção'; fl.setAttribute('aria-label', 'Pedir remoção desta fotografia'); fl.onclick = () => report(p); m.append(fl); }
    if (!own && me && G.state === 'open') {
      const b = document.createElement('button'); b.className = 'like' + (liked.has(p.id) ? ' on' : '');
      b.textContent = '♥ ' + p.likeCount; b.setAttribute('aria-pressed', liked.has(p.id));
      b.onclick = () => like(p, b);
      m.append(b);
    } else {
      const c = document.createElement('span'); c.textContent = '♥ ' + p.likeCount; c.style.color = 'var(--gold)'; m.append(c);
    }
    f.append(im, r, m); grid.append(f);
  });
}

async function like(p, btn) {
  btn.disabled = true;
  try {
    const r = await api('toggleLike', { token: me.token, photoId: p.id });
    r.liked ? liked.add(p.id) : liked.delete(p.id);
    p.likeCount = r.likeCount;
    G = await get('gallery'); render();
  } catch (e) { showBanner(e.message); btn.disabled = false; }
}

$('regBtn').onclick = async () => {
  const b = $('regBtn'); b.disabled = true; msg($('regMsg'), 'A registar…');
  try {
    const r = await api('register', { name: $('nameIn').value });
    me = { token: r.token, name: r.name, participantId: r.participantId };
    localStorage.setItem('gp_me', JSON.stringify(me));
    msg($('regMsg'), '');
    await refresh();
  } catch (e) { msg($('regMsg'), e.message, 'err'); }
  b.disabled = false;
};

$('sort').onchange = renderGrid;
$('shareBtn').onclick = async () => {
  const url = location.href.split('#')[0], title = 'Golden Party — Matilde & Rúben';
  try { if (navigator.share) await navigator.share({ title, url }); else { await navigator.clipboard.writeText(url); showBanner('Ligação copiada!'); } }
  catch (e) { if (e.name !== 'AbortError') showBanner('Copia o endereço da barra do browser para partilhar.'); }
};
async function report(p) {
  const reason = prompt('Porque queres pedir a remoção desta fotografia?');
  if (!reason) return;
  try { await api('requestRemoval', { token: me.token, photoId: p.id, reason }); showBanner('Pedido enviado. A organização vai analisá-lo.'); }
  catch (e) { showBanner(e.message); }
}
$('pickBtn').onclick = () => $('file').click();
$('file').onchange = () => { const f = $('file').files[0]; $('file').value = ''; if (f) upload(f); };

async function optimize(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, DIM / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise((res) => c.toBlob(res, 'image/webp', QUALITY));
  if (!blob || blob.type !== 'image/webp') throw new Error('Este browser não consegue gerar WebP. Experimenta o Chrome ou o Safari mais recente.');
  return blob;
}
const b64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = () => rej(new Error('Falha a ler a fotografia.')); r.readAsDataURL(blob); });

async function upload(file) {
  if (busy) return;
  const out = $('upMsg'), prog = $('prog');
  if (!OK_TYPES.includes(file.type)) return msg(out, 'Formato não permitido.', 'err');
  if (file.size > MAX) return msg(out, 'A fotografia ultrapassa 15 MB.', 'err');
  busy = true; $('pickBtn').disabled = true; prog.hidden = false; prog.value = 0;
  try {
    msg(out, 'A otimizar…');
    const opt = await optimize(file);
    msg(out, 'A enviar…');
    const s = await api('uploadInit', { token: me.token, mimeType: file.type, size: file.size });
    for (let off = 0; off < file.size; off += s.chunkSize) {
      const data = await b64(file.slice(off, off + s.chunkSize));
      await api('uploadChunk', { token: me.token, uploadId: s.uploadId, offset: off, data });
      prog.value = Math.round(Math.min(off + s.chunkSize, file.size) / file.size * 90);
    }
    await api('uploadComplete', { token: me.token, uploadId: s.uploadId, optimizedData: await b64(opt) });
    prog.value = 100; msg(out, 'Fotografia enviada! 🎉', 'okm');
    shuffle = null; await refresh();
  } catch (e) { msg(out, e.message, 'err'); }
  busy = false; $('pickBtn').disabled = false; setTimeout(() => (prog.hidden = true), 1500);
}

refresh();
setInterval(() => { if (!busy && !document.hidden) refresh(); }, 60000);
</script>
</body>
</html>
